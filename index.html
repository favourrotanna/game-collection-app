<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>My game collection</h1>

  <input class="gameinput" type="text" placeholder="Enter your game name">

  <button class="addgame">Add Game</button>
  <button class="removegame">Remove last game</button>

<p class="gamecount">Games in collections: 0</p>

  <ul class="gameList"></ul>

  <div class="confirmbox">
    <h2>Delete this game?</h2>
    <p class="confirmMassage">Are you sure you want to delete this game?</p>

    <button class="confirmDelete">Yes, delete</button>
    <button class="cancelDelete">Cancel</button>

  </div>







  <script src="script.js"></script>
</body>
</html>
